name: 🛠 Android CI / Build & Release APK

on:
  push:
    branches: [ main, master, upgrade ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, upgrade ]

permissions:
  contents: write   # allow creating/updating Releases & uploading assets
  actions:  read    # allow pulling marketplace actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: ✅ Run tests
        run: |
          flutter test --coverage --machine > test-results.json
          TEST_COUNT=$(python3 -c "import json; print(sum(1 for line in open('test-results.json') if line.strip().startswith('{') and json.loads(line).get('type') == 'testDone' and not json.loads(line).get('hidden', False)))")
          echo "Flutter tests passed: ${TEST_COUNT}/5"
          if [ "$TEST_COUNT" -ne 5 ]; then
            echo "Expected exactly 5 tests, but found ${TEST_COUNT}." >&2
            exit 1
          fi
          {
            echo "## Flutter tests"
            echo ""
            echo "✅ **${TEST_COUNT}/5 tests passed**"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: 🏗️ Build APKs
        run: flutter build apk --release 

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/